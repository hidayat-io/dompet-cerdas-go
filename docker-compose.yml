services:
  api:
    build: .
    container_name: dompet-cerdas-go
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    volumes:
      # Mount service account JSON read-only.
      - ./service-account.json:/app/service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
